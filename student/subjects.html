<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Subjects - Student Portal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="back-btn" onclick="window.history.back()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div>
                    <h1 class="page-title">My Subjects</h1>
                    <p class="page-subtitle">Current Semester Subjects & Performance</p>
                </div>
            </div>
            <div class="header-right">
                <div class="semester-selector">
                    <select id="semester-select">
                        <option value="5">Semester 5</option>
                        <option value="4">Semester 4</option>
                        <option value="3">Semester 3</option>
                        <option value="2">Semester 2</option>
                        <option value="1">Semester 1</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="add-subject">
                    <i class="fas fa-plus"></i> Add Subject
                </button>
            </div>
        </header>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);">
                    <i class="fas fa-book-open"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value">6</span>
                    <span class="stat-label">Total Subjects</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #10b981, #059669);">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value">96.8%</span>
                    <span class="stat-label">Overall Attendance</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed);">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value">24</span>
                    <span class="stat-label">Total Credits</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                    <i class="fas fa-star"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value">3.85</span>
                    <span class="stat-label">Semester GPA</span>
                </div>
            </div>
        </div>

        <!-- Subjects Grid -->
        <div class="subjects-grid" id="subjects-container">
            <!-- Subjects will be loaded here -->
        </div>

        <!-- Time Table Section -->
        <div class="card">
            <div class="card-header">
                <h3>Weekly Schedule</h3>
                <button class="btn-icon" id="print-schedule">
                    <i class="fas fa-print"></i>
                </button>
            </div>
            <div class="time-table">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Monday</th>
                            <th>Tuesday</th>
                            <th>Wednesday</th>
                            <th>Thursday</th>
                            <th>Friday</th>
                        </tr>
                    </thead>
                    <tbody id="timetable-body">
                        <!-- Time table will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Faculty Section -->
        <div class="card">
            <div class="card-header">
                <h3>Faculty Contacts</h3>
            </div>
            <div class="faculty-grid" id="faculty-container">
                <!-- Faculty will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Add Subject Modal -->
    <div id="add-subject-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Subject</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="subject-form">
                    <div class="form-group">
                        <label for="subject-code">Subject Code</label>
                        <input type="text" id="subject-code" required placeholder="e.g., BCS-301">
                    </div>
                    <div class="form-group">
                        <label for="subject-name">Subject Name</label>
                        <input type="text" id="subject-name" required placeholder="e.g., Data Structures">
                    </div>
                    <div class="form-group">
                        <label for="subject-credits">Credits</label>
                        <input type="number" id="subject-credits" min="1" max="6" value="4" required>
                    </div>
                    <div class="form-group">
                        <label for="subject-faculty">Faculty</label>
                        <input type="text" id="subject-faculty" required placeholder="e.g., Dr. Williams">
                    </div>
                    <div class="form-group">
                        <label for="subject-schedule">Schedule</label>
                        <select id="subject-schedule" multiple>
                            <option value="mon">Monday</option>
                            <option value="tue">Tuesday</option>
                            <option value="wed">Wednesday</option>
                            <option value="thu">Thursday</option>
                            <option value="fri">Friday</option>
                            <option value="sat">Saturday</option>
                        </select>
                        <small>Hold Ctrl to select multiple days</small>
                    </div>
                    <div class="form-group">
                        <label for="subject-room">Room Number</label>
                        <input type="text" id="subject-room" placeholder="e.g., CS-301">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancel-subject">Cancel</button>
                <button class="btn btn-primary" id="save-subject">Add Subject</button>
            </div>
        </div>
    </div>

    <script src="js/subjects.js"></script>
</body>
</html>
